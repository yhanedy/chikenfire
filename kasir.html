<!DOCTYPE html>
<html lang="id" class="dark h-full bg-zinc-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir - Chicken Fire Mataram</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: { red: '#E70011', hover: '#C0000E' } } } } }
  </script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background-color: #09090b !important; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen h-full flex flex-col overflow-hidden antialiased">

  <!-- MODAL LOGIN KASIR -->
  <div id="login-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="relative bg-zinc-900 border border-zinc-800 rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden">
      <div class="p-6 text-center border-b border-zinc-800">
        <h2 class="text-xl font-black text-white uppercase tracking-wider">LOGIN KASIR</h2>
        <p class="text-xs text-zinc-400 mt-1">Masukkan akun petugas</p>
      </div>
      <form id="login-form" class="p-6 space-y-4">
        <div>
          <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1">Username</label>
          <input type="text" id="login-user" required placeholder="Username" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-100 focus:outline-none focus:border-red-600">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1">Password</label>
          <input type="password" id="login-pass" required placeholder="••••••••" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-100 focus:outline-none focus:border-red-600">
        </div>
        <p id="login-error" class="text-xs text-red-400 font-medium hidden text-center bg-red-950/40 border border-red-900/50 p-2 rounded-lg">Username atau password salah.</p>
        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-extrabold py-3 rounded-xl transition text-xs uppercase tracking-wider">Masuk Sistem</button>
        <div class="text-center mt-2">
          <a href="index.html" class="text-[10px] text-zinc-500 hover:text-white">&larr; Kembali ke Pilih Akses</a>
        </div>
      </form>
    </div>
  </div>

  <!-- HEADER -->
  <header class="bg-zinc-900 border-b border-zinc-800 px-4 py-2 flex items-center justify-between flex-shrink-0">
    <div class="flex items-center space-x-3">
      <div>
        <h1 class="font-black text-xs tracking-wide text-white leading-none">CHICKEN FIRE MATARAM</h1>
        <span class="text-[9px] text-zinc-400 font-medium">Karanganyar - Jawa Tengah</span>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <span id="current-user-display" class="bg-zinc-950 text-zinc-300 text-[10px] font-semibold px-2 py-1 rounded border border-zinc-800">Kasir</span>
      <button id="open-printer-settings-btn" class="bg-zinc-800 hover:bg-zinc-700 text-amber-400 px-2.5 py-1 rounded text-[10px] border border-zinc-700 font-bold flex items-center"><i class="fas fa-print mr-1"></i> Setup Printer</button>
      <a href="index.html" class="bg-red-950/80 hover:bg-red-900 text-red-400 px-2.5 py-1 rounded text-[10px] border border-red-800/50">Keluar</a>
    </div>
  </header>

  <!-- PANEL KASIR -->
  <div id="kasir-view" class="flex flex-1 overflow-hidden">
    <div class="w-7/12 md:w-8/12 p-3 flex flex-col h-full bg-zinc-950 border-r border-zinc-800">
      <div class="flex space-x-1.5 border-b border-zinc-800 mb-2.5 pb-2" id="cat-tabs">
        <button data-cat="semua" class="cat-btn bg-red-600 text-white font-bold px-3 py-1 rounded-lg text-xs">Semua</button>
        <button data-cat="makanan" class="cat-btn bg-zinc-900 text-zinc-400 border border-zinc-800 font-bold px-3 py-1 rounded-lg text-xs">Makanan</button>
        <button data-cat="minuman" class="cat-btn bg-zinc-900 text-zinc-400 border border-zinc-800 font-bold px-3 py-1 rounded-lg text-xs">Minuman</button>
        <button data-cat="paket" class="cat-btn bg-zinc-900 text-zinc-400 border border-zinc-800 font-bold px-3 py-1 rounded-lg text-xs">Paket</button>
      </div>
      <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 overflow-y-auto pr-1 pb-6">
        <p class="text-xs text-zinc-500 col-span-4 text-center py-10">Memuat menu...</p>
      </div>
    </div>

    <div class="w-5/12 md:w-4/12 bg-zinc-900 flex flex-col h-full justify-between border-l border-zinc-800 overflow-hidden">
      <div class="p-2.5 bg-zinc-900 border-b border-zinc-800 flex-shrink-0">
        <div class="grid grid-cols-2 gap-1.5">
          <div>
            <label class="text-[9px] font-bold text-zinc-400 block mb-0.5">CUSTOMER</label>
            <input type="text" id="customer-select" value="Pelanggan Umum" class="w-full bg-zinc-950 border border-zinc-800 rounded p-1 text-xs text-zinc-100">
          </div>
          <div>
            <label class="text-[9px] font-bold text-zinc-400 block mb-0.5">NO. MEJA / TIPE</label>
            <input type="text" id="table-no" placeholder="Meja / Takeaway" class="w-full bg-zinc-950 border border-zinc-800 rounded p-1 text-xs text-zinc-100">
          </div>
        </div>
      </div>

      <div class="p-2 flex-1 overflow-y-auto min-h-0">
        <div class="flex justify-between items-center border-b border-zinc-800 pb-1 mb-1.5">
          <h3 class="font-bold text-zinc-300 text-[10px] uppercase">Daftar Pesanan</h3>
          <button id="clear-cart-btn" class="text-[9px] text-red-400 hover:underline">Hapus Semua</button>
        </div>
        <div id="cart-items" class="space-y-1.5"></div>
      </div>

      <div class="bg-zinc-950 border-t border-zinc-800 p-2.5 space-y-1.5 text-xs flex-shrink-0">
        <div class="flex justify-between items-center bg-zinc-900 p-2 rounded border border-zinc-800">
          <span class="text-[10px] font-bold text-zinc-400">TOTAL BELANJA</span>
          <span id="cart-total" class="text-sm font-black text-red-500">Rp 0</span>
        </div>
        <button id="open-pay-modal-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-extrabold py-3 rounded-xl transition shadow-lg text-xs uppercase">
          <i class="fas fa-cash-register mr-1"></i> Bayar Sekarang
        </button>
      </div>
    </div>
  </div>

  <!-- POPUP PEMBAYARAN -->
  <div id="pay-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 hidden">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-zinc-800 bg-zinc-950 flex justify-between items-center">
        <h3 class="text-sm font-bold text-white"><i class="fas fa-cash-register text-red-500 mr-2"></i> Pembayaran</h3>
        <button id="close-pay-modal-btn" class="text-zinc-400 hover:text-white"><i class="fas fa-times"></i></button>
      </div>
      <div class="p-4 space-y-3 text-xs">
        <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-3 flex justify-between items-center">
          <span class="text-[10px] font-bold text-zinc-400 uppercase">Total Belanja</span>
          <span id="pay-modal-total" class="text-xl font-black text-red-500">Rp 0</span>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" id="pay-modal-cash" class="py-2 rounded-lg border text-xs font-bold border-red-600 bg-red-600 text-white">CASH</button>
          <button type="button" id="pay-modal-qris" class="py-2 rounded-lg border text-xs font-bold border-zinc-800 bg-zinc-900 text-zinc-400">QRIS</button>
        </div>
        <div id="pay-modal-cash-group" class="space-y-2">
          <label class="text-[10px] font-bold text-zinc-400 uppercase block">Uang Diterima</label>
          <input type="number" id="pay-modal-amount" placeholder="0" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-base font-bold text-zinc-100 focus:outline-none focus:border-red-600">
          <div class="flex space-x-1">
            <button type="button" onclick="setQuickCashModal(20000)" class="flex-1 bg-zinc-900 text-zinc-300 font-bold py-1.5 rounded text-[11px] border border-zinc-800">20K</button>
            <button type="button" onclick="setQuickCashModal(50000)" class="flex-1 bg-zinc-900 text-zinc-300 font-bold py-1.5 rounded text-[11px] border border-zinc-800">50K</button>
            <button type="button" onclick="setQuickCashModal(100000)" class="flex-1 bg-zinc-900 text-zinc-300 font-bold py-1.5 rounded text-[11px] border border-zinc-800">100K</button>
            <button type="button" onclick="setQuickCashModal(0)" class="flex-1 bg-zinc-900 text-zinc-300 font-bold py-1.5 rounded text-[11px] border border-zinc-800">Uang Pas</button>
          </div>
        </div>
        <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-3 flex justify-between items-center">
          <span class="text-[10px] font-bold text-zinc-400 uppercase">Kembalian</span>
          <span id="pay-modal-change" class="text-lg font-black text-emerald-400">Rp 0</span>
        </div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button id="pay-modal-print" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 font-bold py-2.5 rounded-lg text-xs"><i class="fas fa-print mr-1"></i> Cetak Saja</button>
          <button id="pay-modal-confirm" class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-2.5 rounded-lg text-xs"><i class="fas fa-check mr-1"></i> Simpan & Cetak</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL PRINTER (SAMA SEPERTI SEBELUMNYA) -->
  <div id="printer-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 hidden">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-950">
        <h3 class="text-sm font-bold text-white"><i class="fas fa-print text-amber-500 mr-2"></i> Pengaturan Printer</h3>
        <button id="close-printer-modal-btn" class="text-zinc-400 hover:text-white"><i class="fas fa-times"></i></button>
      </div>
      <div class="p-5 overflow-y-auto space-y-4 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-[10px] font-bold text-zinc-400 block mb-1">Nama Toko</label><input type="text" id="cfg-store-name" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-zinc-100"></div>
          <div><label class="text-[10px] font-bold text-zinc-400 block mb-1">Telepon</label><input type="text" id="cfg-store-phone" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-zinc-100"></div>
        </div>
        <div><label class="text-[10px] font-bold text-zinc-400 block mb-1">Alamat</label><input type="text" id="cfg-store-address" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-zinc-100"></div>
        <div><label class="text-[10px] font-bold text-zinc-400 block mb-1">Footer Struk</label><input type="text" id="cfg-store-footer" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-zinc-100"></div>
      </div>
      <div class="p-4 border-t border-zinc-800 bg-zinc-950 flex justify-end">
        <button id="save-printer-settings-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold px-5 py-2 rounded-lg text-xs">Simpan</button>
      </div>
    </div>
  </div>

  <script type="module" src="kasir.js"></script>
  <script>
    function toggleFullScreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => console.log(err));
      else if (document.exitFullscreen) document.exitFullscreen();
    }
  </script>
</body>
</html>
