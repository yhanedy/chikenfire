<!DOCTYPE html>
<html lang="id" class="dark h-full bg-zinc-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir - Chicken Fire Mataram</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: { red: '#E70011' } } } } }
  </script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background-color: #09090b !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen h-full flex flex-col overflow-hidden antialiased">

  <!-- MODAL LOGIN KASIR -->
  <div id="login-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-3xl shadow-2xl w-full max-w-md overflow-hidden">
      <div class="p-6 text-center border-b border-zinc-800">
        <h2 class="text-2xl font-black text-white uppercase tracking-wider">LOGIN KASIR</h2>
      </div>
      <form id="login-form" class="p-6 space-y-5">
        <div>
          <label class="block text-sm font-bold text-zinc-400 uppercase mb-2">Username</label>
          <input type="text" id="login-user" required placeholder="Username" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-base text-zinc-100 focus:outline-none focus:border-red-600">
        </div>
        <div>
          <label class="block text-sm font-bold text-zinc-400 uppercase mb-2">Password</label>
          <input type="password" id="login-pass" required placeholder="••••••••" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-base text-zinc-100 focus:outline-none focus:border-red-600">
        </div>
        <p id="login-error" class="text-sm text-red-400 font-medium hidden text-center bg-red-950/40 border border-red-900/50 p-3 rounded-lg">Username atau password salah.</p>
        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-extrabold py-4 rounded-xl transition text-base uppercase tracking-wider">Masuk Sistem</button>
        <div class="text-center mt-2">
          <a href="index.html" class="text-sm text-zinc-500 hover:text-white">&larr; Kembali ke Pilih Akses</a>
        </div>
      </form>
    </div>
  </div>

  <!-- HEADER UTAMA -->
  <header class="bg-zinc-900 border-b border-zinc-800 px-4 py-3 flex items-center justify-between flex-shrink-0">
    <div class="flex items-center space-x-3">
      <h1 class="font-black text-lg tracking-wide text-white leading-none">CHICKEN FIRE MATARAM</h1>
    </div>
    <div class="flex items-center space-x-3">
      <span id="current-user-display" class="bg-zinc-950 text-zinc-300 text-sm font-semibold px-3 py-1.5 rounded-lg border border-zinc-800">Kasir</span>
      <a href="riwayat_kasir.html" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-4 py-1.5 rounded-lg text-sm font-bold border border-zinc-700 transition"><i class="fas fa-history mr-2"></i>Riwayat</a>
      <a href="index.html" class="bg-red-950/80 hover:bg-red-900 text-red-400 px-4 py-1.5 rounded-lg text-sm font-bold border border-red-800/50 transition">Keluar</a>
    </div>
  </header>

  <!-- PANEL KASIR -->
  <div id="kasir-view" class="flex flex-1 overflow-hidden">
    <div class="w-7/12 md:w-8/12 p-4 flex flex-col h-full bg-zinc-950 border-r border-zinc-800">
      <div class="flex space-x-2 border-b border-zinc-800 mb-3 pb-3" id="cat-tabs">
        <button data-cat="semua" class="cat-btn bg-red-600 text-white font-bold px-4 py-2 rounded-lg text-sm">Semua</button>
        <button data-cat="makanan" class="cat-btn bg-zinc-900 text-zinc-400 border border-zinc-800 font-bold px-4 py-2 rounded-lg text-sm">Makanan</button>
        <button data-cat="minuman" class="cat-btn bg-zinc-900 text-zinc-400 border border-zinc-800 font-bold px-4 py-2 rounded-lg text-sm">Minuman</button>
        <button data-cat="paket" class="cat-btn bg-zinc-900 text-zinc-400 border border-zinc-800 font-bold px-4 py-2 rounded-lg text-sm">Paket</button>
      </div>
      <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 overflow-y-auto pr-2 pb-6">
        <!-- Produk dimuat via JS -->
      </div>
    </div>

    <div class="w-5/12 md:w-4/12 bg-zinc-900 flex flex-col h-full justify-between border-l border-zinc-800 overflow-hidden">
      <div class="p-3 bg-zinc-900 border-b border-zinc-800 flex-shrink-0">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-bold text-zinc-400 block mb-1">CUSTOMER</label>
            <input type="text" id="customer-select" value="Pelanggan Umum" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2 text-sm text-zinc-100">
          </div>
          <div>
            <label class="text-xs font-bold text-zinc-400 block mb-1">NO. MEJA</label>
            <input type="text" id="table-no" placeholder="Meja / Takeaway" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2 text-sm text-zinc-100">
          </div>
        </div>
      </div>

      <div class="p-3 flex-1 overflow-y-auto min-h-0">
        <div class="flex justify-between items-center border-b border-zinc-800 pb-2 mb-3">
          <h3 class="font-bold text-zinc-200 text-sm uppercase">Pesanan</h3>
          <button id="clear-cart-btn" class="text-xs text-red-400 hover:underline">Hapus Semua</button>
        </div>
        <div id="cart-items" class="space-y-2"></div>
      </div>

      <div class="bg-zinc-950 border-t border-zinc-800 p-4 space-y-3 flex-shrink-0">
        <div class="flex justify-between items-center bg-zinc-900 p-3 rounded-xl border border-zinc-800">
          <span class="text-sm font-bold text-zinc-400">TOTAL</span>
          <span id="cart-total" class="text-2xl font-black text-red-500">Rp 0</span>
        </div>
        <button id="open-pay-modal-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-extrabold py-4 rounded-xl transition shadow-lg text-base uppercase tracking-wide">
          <i class="fas fa-cash-register mr-2"></i> Bayar Sekarang
        </button>
      </div>
    </div>
  </div>

  <!-- POPUP PEMBAYARAN -->
  <div id="pay-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center z-50 p-4 hidden">
    <div class="bg-zinc-900 border border-zinc-800 rounded-3xl w-full max-w-md overflow-hidden shadow-2xl">
      <div class="p-5 border-b border-zinc-800 bg-zinc-950 flex justify-between items-center">
        <h3 class="text-lg font-bold text-white"><i class="fas fa-cash-register text-red-500 mr-2"></i> Pembayaran</h3>
        <button id="close-pay-modal-btn" class="text-zinc-400 hover:text-white text-xl"><i class="fas fa-times"></i></button>
      </div>
      <div class="p-5 space-y-4 text-sm">
        <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-4 flex justify-between items-center">
          <span class="font-bold text-zinc-400">Total Belanja</span>
          <span id="pay-modal-total" class="text-2xl font-black text-red-500">Rp 0</span>
        </div>
        
        <!-- Tombol Metode Pembayaran (QRIS Aktif) -->
        <div class="grid grid-cols-2 gap-2">
          <button type="button" id="pay-modal-cash" class="py-3 rounded-xl border font-bold border-red-600 bg-red-600 text-white transition-colors">CASH</button>
          <button type="button" id="pay-modal-qris" class="py-3 rounded-xl border font-bold border-zinc-800 bg-zinc-900 text-zinc-400 transition-colors">QRIS</button>
        </div>

        <div id="pay-modal-cash-group" class="space-y-2">
          <label class="font-bold text-zinc-400 block">Uang Diterima</label>
          <input type="number" id="pay-modal-amount" placeholder="0" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-4 text-xl font-black text-zinc-100 focus:outline-none focus:border-red-600">
          <div class="grid grid-cols-4 gap-2 pt-1">
            <button type="button" onclick="setQuickCash(20000)" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold py-2 rounded-lg text-xs border border-zinc-700">20K</button>
            <button type="button" onclick="setQuickCash(50000)" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold py-2 rounded-lg text-xs border border-zinc-700">50K</button>
            <button type="button" onclick="setQuickCash(100000)" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold py-2 rounded-lg text-xs border border-zinc-700">100K</button>
            <button type="button" onclick="setQuickCash(0)" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold py-2 rounded-lg text-xs border border-zinc-700">PAS</button>
          </div>
        </div>

        <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-4 flex justify-between items-center">
          <span class="font-bold text-zinc-400">Kembalian</span>
          <span id="pay-modal-change" class="text-xl font-black text-emerald-400">Rp 0</span>
        </div>

        <button id="pay-modal-confirm" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-4 rounded-xl text-base mt-2"><i class="fas fa-check mr-2"></i> Proses & Cetak Struk</button>
      </div>
    </div>
  </div>

  <!-- POPUP CETAK DAPUR/BAR -->
  <div id="print-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center z-50 p-4 hidden">
    <div class="bg-zinc-900 border border-zinc-800 rounded-3xl w-full max-w-md overflow-hidden shadow-2xl">
      <div class="p-5 border-b border-zinc-800 bg-zinc-950 text-center">
        <h3 class="text-lg font-bold text-white"><i class="fas fa-check-circle text-emerald-500 mr-2"></i> Transaksi Selesai</h3>
      </div>
      <div class="p-6 space-y-4">
        <p class="text-sm text-zinc-400 text-center mb-4">Pilih cetak struk untuk bagian terkait:</p>
        <div class="grid grid-cols-2 gap-3">
          <button id="print-kitchen-btn" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 rounded-xl text-sm transition flex flex-col items-center justify-center">
            <i class="fas fa-utensils text-2xl mb-2"></i> CETAK DAPUR
          </button>
          <button id="print-drink-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl text-sm transition flex flex-col items-center justify-center">
            <i class="fas fa-glass-martini-alt text-2xl mb-2"></i> CETAK BAR
          </button>
        </div>
        <button id="close-print-modal-btn" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold py-3 rounded-xl text-sm mt-2">Selesai / Tutup</button>
      </div>
    </div>
  </div>

  <script type="module" src="kasir.js"></script>
  <script>
    function toggleFullScreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => console.log(err));
      else if (document.exitFullscreen) document.exitFullscreen();
    }
  </script>
</body>
</html>
