<!DOCTYPE html>
<html lang="id" class="dark h-full bg-transparent">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Kasir - Chicken Fire Mataram</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: { red: '#E70011' } } } } }
  </script>
  <style>
    /* Menghilangkan scrollbar bawaan iframe jika ada */
    body { background-color: transparent !important; margin: 0; padding: 0; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
  </style>
</head>
<body class="text-zinc-100 font-sans p-2 md:p-4 antialiased">

  <!-- Kontainer Utama Pop-up -->
  <div class="bg-zinc-900 border border-zinc-700 rounded-3xl shadow-2xl w-full max-w-5xl mx-auto overflow-hidden">
    
    <!-- Header Pop-up -->
    <div class="flex justify-between items-center bg-zinc-950 p-5 border-b border-zinc-800">
      <h1 class="font-black text-lg text-white"><i class="fas fa-history text-red-500 mr-2"></i> RIWAYAT TRANSAKSI</h1>
      <!-- Tombol Close (X) -->
      <button id="close-btn" class="w-8 h-8 flex items-center justify-center bg-zinc-800 hover:bg-red-600 text-zinc-400 hover:text-white rounded-full transition-all duration-200">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Isi Konten -->
    <div class="p-5 space-y-5 max-h-[80vh] overflow-y-auto">
      
      <!-- Kartu Omset -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-gradient-to-r from-red-900/40 to-zinc-900 border border-red-900/50 rounded-2xl p-4 shadow-lg">
          <p class="text-xs font-bold text-red-400 uppercase tracking-widest mb-1">Omset Hari Ini</p>
          <h3 id="stat-today-revenue" class="text-2xl font-black text-white">Rp 0</h3>
        </div>
        <div class="bg-gradient-to-r from-emerald-900/40 to-zinc-900 border border-emerald-900/50 rounded-2xl p-4 shadow-lg">
          <p class="text-xs font-bold text-emerald-400 uppercase tracking-widest mb-1">Omset Bulan Ini</p>
          <h3 id="stat-month-revenue" class="text-2xl font-black text-white">Rp 0</h3>
        </div>
      </div>

      <!-- Tabel Transaksi -->
      <div class="overflow-x-auto bg-zinc-950 rounded-xl border border-zinc-800">
        <table class="w-full text-left text-sm text-zinc-300">
          <thead class="bg-zinc-900 text-zinc-400 uppercase text-xs border-b border-zinc-800">
            <tr>
              <th class="p-4">Waktu</th>
              <th class="p-4">Kasir</th>
              <th class="p-4">Customer</th>
              <th class="p-4">Metode</th>
              <th class="p-4 text-right">Total</th>
              <th class="p-4 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="transaction-rows" class="divide-y divide-zinc-800/60">
            <tr><td colspan="6" class="text-center py-8">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script type="module">
    import { sql } from "./neon-config.js";

    // Fungsi untuk menutup iframe/pop-up dari dalam
    document.getElementById('close-btn').addEventListener('click', () => {
      // Cek jika berada di dalam iframe, minta parent menutupnya
      if (window.parent && window.parent !== window) {
        window.parent.postMessage('closeHistory', '*');
      } else {
        // Jika dibuka langsung (bukan iframe), kembali ke halaman kasir
        window.location.href = 'kasir.html';
      }
    });

    async function loadHistory() {
      const tbody = document.getElementById('transaction-rows');
      try {
        const rows = await sql`SELECT * FROM orders ORDER BY created_at DESC LIMIT 50`;
        
        const now = new Date();
        let todayRev = 0;
        let monthRev = 0;

        rows.forEach(o => {
          if (o.status === 'CANCELLED') return;
          const d = new Date(o.created_at);
          const amt = parseFloat(o.total_amount) || 0;

          if (d.toDateString() === now.toDateString()) todayRev += amt;
          if (d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) monthRev += amt;
        });

        document.getElementById('stat-today-revenue').innerText = 'Rp ' + todayRev.toLocaleString('id-ID');
        document.getElementById('stat-month-revenue').innerText = 'Rp ' + monthRev.toLocaleString('id-ID');

        tbody.innerHTML = '';
        if(!rows.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-zinc-500">Belum ada transaksi.</td></tr>';
            return;
        }

        rows.forEach(o => {
          const date = new Date(o.created_at).toLocaleString('id-ID');
          const isCancelled = o.status === 'CANCELLED';
          const isCash = o.payment_method === 'CASH';
          
          const methodBadge = isCash 
            ? '<span class="bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-lg text-xs font-bold border border-emerald-500/30">CASH</span>'
            : '<span class="bg-blue-500/20 text-blue-400 px-3 py-1 rounded-lg text-xs font-bold border border-blue-500/30">QRIS</span>';
          
          tbody.innerHTML += `
            <tr class="hover:bg-zinc-800/40 transition ${isCancelled ? 'opacity-50' : ''}">
              <td class="p-4 font-mono text-xs text-zinc-400">${date}</td>
              <td class="p-4 font-bold text-white">${o.cashier_name}</td>
              <td class="p-4">${o.customer_name}</td>
              <td class="p-4">${methodBadge}</td>
              <td class="p-4 text-right font-black ${isCancelled ? 'line-through text-zinc-500' : 'text-red-500'}">Rp ${parseFloat(o.total_amount).toLocaleString('id-ID')}</td>
              <td class="p-4 text-center">
                ${isCancelled 
                  ? '<span class="text-red-400 font-bold text-xs bg-red-950/50 px-3 py-1 rounded-lg border border-red-900/50">BATAL</span>' 
                  : `<button onclick="cancelOrder(${o.id})" class="bg-zinc-800 hover:bg-red-900 text-zinc-300 hover:text-white border border-zinc-700 px-4 py-1.5 rounded-lg text-xs font-bold transition">Batalkan</button>`}
              </td>
            </tr>
          `;
        });

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-red-500">Error: ${err.message}</td></tr>`;
      }
    }

    window.cancelOrder = async (id) => {
      const reason = prompt("Alasan pembatalan:", "Salah Input");
      if (!reason) return;

      try {
        await sql`UPDATE orders SET status = 'CANCELLED', cancel_reason = ${reason} WHERE id = ${id}`;
        loadHistory(); // Refresh tabel
      } catch (err) {
        alert("Gagal membatalkan pesanan.");
      }
    };

    loadHistory();
  </script>
</body>
</html>
