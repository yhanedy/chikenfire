<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat - Chicken Fire Mataram</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: { red: '#E70011' } } } } }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen p-6">

  <div class="max-w-7xl mx-auto space-y-6">
    <div class="flex justify-between items-center bg-zinc-900 p-4 rounded-xl border border-zinc-800">
      <h1 class="font-black text-lg text-white">RIWAYAT TRANSAKSI</h1>
      <a href="index.html" class="bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-lg text-xs font-bold text-white transition">&larr; Kembali ke Kasir</a>
    </div>

    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-zinc-300">
          <thead class="bg-zinc-950 text-zinc-400 uppercase text-[10px] border-b border-zinc-800">
            <tr>
              <th class="p-3">Waktu</th>
              <th class="p-3">Kasir</th>
              <th class="p-3">Customer</th>
              <th class="p-3">Total</th>
            </tr>
          </thead>
          <tbody id="transaction-rows">
            <tr><td colspan="4" class="text-center py-6">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT RIWAYAT (ESM CDN) -->
  <script type="module">
    import { neon } from "https://esm.sh/@neondatabase/serverless";
    const sql = neon("postgresql://neondb_owner:npg_o3iR4ANwckWh@ep-still-frost-aos4ozvz-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require");

    async function loadHistory() {
      const tbody = document.getElementById('transaction-rows');
      try {
        const rows = await sql`SELECT * FROM orders ORDER BY created_at DESC LIMIT 50`;
        tbody.innerHTML = '';
        
        if(!rows.length) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-zinc-500">Belum ada transaksi.</td></tr>';
            return;
        }

        rows.forEach(o => {
          const date = new Date(o.created_at).toLocaleString('id-ID');
          tbody.innerHTML += `
            <tr class="border-b border-zinc-800 hover:bg-zinc-800/50">
              <td class="p-3 font-mono text-[11px] text-zinc-400">${date}</td>
              <td class="p-3 font-bold text-white">${o.cashier_name}</td>
              <td class="p-3">${o.customer_name}</td>
              <td class="p-3 text-red-500 font-black">Rp ${parseFloat(o.total_amount).toLocaleString('id-ID')}</td>
            </tr>
          `;
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-red-500">Error: ${err.message}</td></tr>`;
      }
    }

    loadHistory();
  </script>
</body>
</html>
