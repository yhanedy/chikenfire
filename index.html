<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chicken Fire Mataram - Kasir POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    /* Styling khusus warna Bendera Merah Putih & Scrollbar */
    .bg-merah-id { background-color: #E70011; }
    .text-merah-id { color: #E70011; }
    .border-merah-id { border-color: #E70011; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col overflow-hidden">

  <!-- MODAL LOGIN ADMIN (Muncul di Awal) -->
  <div id="login-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden border-t-8 border-red-600">
      <div class="bg-merah-id text-white p-6 text-center">
        <i class="fas fa-fire text-4xl mb-2 text-yellow-300"></i>
        <h2 class="text-2xl font-extrabold tracking-wide uppercase">Chicken Fire Mataram</h2>
        <p class="text-xs text-red-100 mt-1">Sistem Kasir & Manajemen Restoran</p>
      </div>
      <form id="login-form" onsubmit="handleLogin(event)" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nama Admin / Username</label>
          <div class="relative">
            <input type="text" id="login-user" required placeholder="Masukkan username" class="w-full pl-10 pr-4 py-2.5 border rounded-lg text-sm focus:outline-none focus:border-red-600">
            <i class="fas fa-user absolute left-3 top-3 text-gray-400"></i>
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Password</label>
          <div class="relative">
            <input type="password" id="login-pass" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 border rounded-lg text-sm focus:outline-none focus:border-red-600">
            <i class="fas fa-lock absolute left-3 top-3 text-gray-400"></i>
          </div>
        </div>
        <p id="login-error" class="text-xs text-red-600 font-semibold hidden"><i class="fas fa-exclamation-circle mr-1"></i> Username atau Password salah!</p>
        <button type="submit" class="w-full bg-merah-id text-white font-bold py-3 rounded-lg hover:bg-red-700 transition shadow-md text-sm">
          <i class="fas fa-sign-in-alt mr-2"></i> MASUK KASIR
        </button>
      </form>
    </div>
  </div>

  <!-- TOP HEADER BAR (Merah Putih Theme) -->
  <header class="bg-merah-id text-white px-5 py-2.5 flex items-center justify-between shadow-lg border-b-4 border-white">
    <div class="flex items-center space-x-3">
      <div class="bg-white text-merah-id p-2 rounded-lg font-black text-xl shadow">
        <i class="fas fa-fire"></i>
      </div>
      <div>
        <h1 class="font-extrabold text-lg tracking-wider leading-none">CHICKEN FIRE MATARAM</h1>
        <span class="text-xs text-white/90 font-medium">POS Restoran & Kasir</span>
      </div>
    </div>

    <!-- User Logged In & Search Bar -->
    <div class="flex items-center space-x-3 w-7/12">
      <div class="relative w-full">
        <input type="text" id="search-product" placeholder="Cari Makanan, Minuman, Paket..." class="w-full pl-9 pr-3 py-1.5 rounded-lg text-gray-800 text-sm focus:outline-none shadow-inner">
        <i class="fas fa-search absolute left-3 top-2.5 text-gray-400 text-sm"></i>
      </div>

      <!-- Button Admin Panel & Logout -->
      <div class="flex items-center space-x-2 whitespace-nowrap">
        <span id="current-user-display" class="bg-white/20 text-white text-xs font-bold px-3 py-1.5 rounded-lg">Admin</span>
        <button onclick="openAdminModal()" class="bg-white text-merah-id font-bold px-3 py-1.5 rounded-lg text-xs hover:bg-gray-100 transition shadow">
          <i class="fas fa-cog mr-1"></i> Admin Panel
        </button>
        <button onclick="logout()" class="bg-red-900 text-white font-bold px-2.5 py-1.5 rounded-lg text-xs hover:bg-red-950 transition">
          <i class="fas fa-power-off"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER (Split POS Layout) -->
  <div class="flex flex-1 overflow-hidden">

    <!-- LEFT PANEL: KATALOG PRODUK -->
    <div class="w-7/12 md:w-8/12 p-4 flex flex-col h-full bg-white border-r border-gray-200">
      
      <!-- Tab Kategori -->
      <div class="flex space-x-2 border-b-2 border-red-600 mb-3 pb-1">
        <button onclick="filterCategory('semua')" class="cat-btn bg-merah-id text-white font-bold px-4 py-1.5 rounded-t-lg text-xs">Semua</button>
        <button onclick="filterCategory('makanan')" class="cat-btn bg-gray-100 text-gray-700 font-bold px-4 py-1.5 rounded-t-lg text-xs hover:bg-red-50">Makanan</button>
        <button onclick="filterCategory('minuman')" class="cat-btn bg-gray-100 text-gray-700 font-bold px-4 py-1.5 rounded-t-lg text-xs hover:bg-red-50">Minuman</button>
        <button onclick="filterCategory('paket')" class="cat-btn bg-gray-100 text-gray-700 font-bold px-4 py-1.5 rounded-t-lg text-xs hover:bg-red-50">Paket</button>
      </div>

      <!-- Grid Cards Produk -->
      <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 overflow-y-auto pr-1 pb-10">
        <!-- Item Dummy (Akan Terhubung ke Firestore) -->
        <div class="bg-white border-2 border-gray-100 rounded-xl overflow-hidden shadow-sm hover:border-red-500 hover:shadow-md cursor-pointer transition" onclick="addToCart('1', 'Ayam Pedas Lava', 25000, 'makanan')">
          <img src="https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?w=300" class="w-full h-24 object-cover">
          <div class="p-2">
            <span class="text-[10px] bg-red-100 text-red-600 font-bold px-1.5 py-0.5 rounded">Makanan</span>
            <h4 class="font-bold text-gray-800 text-xs mt-1 truncate">Ayam Pedas Lava</h4>
            <p class="text-merah-id font-black text-xs">Rp 25.000</p>
          </div>
        </div>

        <div class="bg-white border-2 border-gray-100 rounded-xl overflow-hidden shadow-sm hover:border-red-500 hover:shadow-md cursor-pointer transition" onclick="addToCart('2', 'Es Jeruk Mataram', 8000, 'minuman')">
          <img src="https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=300" class="w-full h-24 object-cover">
          <div class="p-2">
            <span class="text-[10px] bg-blue-100 text-blue-600 font-bold px-1.5 py-0.5 rounded">Minuman</span>
            <h4 class="font-bold text-gray-800 text-xs mt-1 truncate">Es Jeruk Mataram</h4>
            <p class="text-merah-id font-black text-xs">Rp 8.000</p>
          </div>
        </div>

        <div class="bg-white border-2 border-gray-100 rounded-xl overflow-hidden shadow-sm hover:border-red-500 hover:shadow-md cursor-pointer transition" onclick="addToCart('3', 'Paket Fire Hemat', 30000, 'paket')">
          <img src="https://images.unsplash.com/photo-1562967914-608f82629710?w=300" class="w-full h-24 object-cover">
          <div class="p-2">
            <span class="text-[10px] bg-yellow-100 text-yellow-700 font-bold px-1.5 py-0.5 rounded">Paket</span>
            <h4 class="font-bold text-gray-800 text-xs mt-1 truncate">Paket Fire Hemat</h4>
            <p class="text-merah-id font-black text-xs">Rp 30.000</p>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL: DAFTAR PESANAN & KASIR -->
    <div class="w-5/12 md:w-4/12 bg-gray-50 flex flex-col h-full justify-between border-l">
      
      <!-- Detail Pelanggan & Meja -->
      <div class="p-3 bg-white border-b space-y-2">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] font-bold
