<!DOCTYPE html>
<html lang="id" class="dark h-full bg-zinc-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chicken Fire Mataram - Pilih Akses</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: { red: '#E70011' } } } } }
  </script>
  <style>
    html, body { height: 100%; margin: 0; background-color: #09090b !important; }
  </style>
</head>
<body class="text-zinc-100 font-sans min-h-screen flex items-center justify-center p-4 antialiased selection:bg-red-500 selection:text-white">

  <div class="max-w-3xl w-full grid grid-cols-1 md:grid-cols-2 gap-6">
    
    <!-- Card Kasir -->
    <a href="kasir.html" class="bg-zinc-900 border border-zinc-800 rounded-3xl p-8 hover:border-red-600 hover:shadow-[0_0_30px_rgba(231,0,17,0.2)] transition-all duration-300 group flex flex-col items-center text-center">
      <div class="w-20 h-20 bg-red-950/50 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
        <i class="fas fa-cash-register text-4xl text-red-500"></i>
      </div>
      <h2 class="text-xl font-black text-white uppercase tracking-wider mb-2">Masuk Kasir</h2>
      <p class="text-xs text-zinc-400">Khusus untuk petugas siswa. Melayani pesanan dan mencetak struk.</p>
    </a>

    <!-- Card Admin -->
    <a href="admin.html" class="bg-zinc-900 border border-zinc-800 rounded-3xl p-8 hover:border-blue-600 hover:shadow-[0_0_30px_rgba(37,99,235,0.2)] transition-all duration-300 group flex flex-col items-center text-center">
      <div class="w-20 h-20 bg-blue-950/50 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
        <i class="fas fa-shield-alt text-4xl text-blue-500"></i>
      </div>
      <h2 class="text-xl font-black text-white uppercase tracking-wider mb-2">Masuk Admin</h2>
      <p class="text-xs text-zinc-400">Kelola menu, harga, akun kasir, dan sistem restoran.</p>
    </a>

  </div>

</body>
</html>
